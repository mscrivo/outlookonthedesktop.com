allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - '@astrojs/markdown-satteri@0.3.1'
  - astro-eslint-parser@2.0.0
  - astro@7.0.0
  - eslint-plugin-astro@2.0.0
onlyBuiltDependencies:
  - esbuild
  - sharp
overrides:
  # rolldown pulls in @emnapi 2.0 betas, which break @astrojs/astro2tsx (core 1.x + runtime 2.x mismatch
  # makes `astro check` fail to load). Drop once astro2tsx supports emnapi 2.
  '@emnapi/core': ^1.11.3
  '@emnapi/runtime': ^1.11.3
